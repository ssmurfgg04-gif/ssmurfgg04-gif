name: neon snake

on:
  schedule:
    # daily at 02:00 UTC = 05:00 Nairobi (EAT) — fresh neon every morning
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # a magenta beak eating cyan dots — brand palette, daily refresh
      - name: generate neon snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF2A6D&color_dots=#EDF2F7,#D9F4F8,#A8E8F0,#54D4E4,#05D9E8
            dist/snake-dark.svg?color_snake=#FF2A6D&color_dots=#101526,#0F3B46,#0E5A6E,#08B0C2,#05D9E8

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
