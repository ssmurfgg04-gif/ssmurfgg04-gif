name: ❄ arctic snake

on:
  schedule:
    # daily at 02:00 UTC = 05:00 Nairobi (EAT) — fresh ice every morning
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # an orange beak eating ice-blue dots — brand palette, daily refresh
      - name: generate arctic snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E67E09&color_dots=#EAF3F9,#C6DEF0,#8FC3E8,#5AA3D9,#2C7BBF
            dist/snake-dark.svg?color_snake=#FF9E1B&color_dots=#0D1B2A,#16405F,#1E5C8A,#2E7FB8,#7CDBF5

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
